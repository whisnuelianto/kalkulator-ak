<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direktori PIC — Jabatan Fungsional</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

:root{
  --navy: #0d1930;
  --navy-2: #16294e;
  --navy-3: #24407a;
  --gold: #c9a036;
  --gold-2: #9c7a1f;
  --gold-light: #e8c468;
  --teal: #1f3a44;
  --teal-2: #3f6b74;
  --plum: #4a2634;
  --plum-2: #7a3d4a;
  --cream: #faf6ec;
  --ink: #1b2540;
  --muted: #667085;
  --danger: #b23a3a;
  --success: #2f7a52;
  --border: #e4dcc4;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(16,32,63,0.07);
  --shadow-md: 0 16px 40px rgba(16,32,63,0.16);
  --ease: cubic-bezier(.2,.7,.3,1);
}

*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
}
.serif{ font-family: 'Fraunces', Georgia, serif; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---------- HERO ---------- */
.hero{
  position: relative;
  background: radial-gradient(circle at 88% -20%, #2c4a8c 0%, transparent 55%), linear-gradient(165deg, var(--navy) 0%, var(--navy-2) 100%);
  color: #fff;
  padding: 68px 32px 48px;
  overflow: hidden;
}
.hero-pattern{
  position: absolute; top: -50px; right: -50px; width: 300px; height: 300px; opacity: 0.12;
  background-image:
    repeating-linear-gradient(45deg, var(--gold-light) 0 2px, transparent 2px 24px),
    repeating-linear-gradient(-45deg, var(--gold-light) 0 2px, transparent 2px 24px);
  pointer-events: none;
}
.hero-inner{ position: relative; max-width: 1160px; margin: 0 auto; }
.eyebrow-row{ display:flex; align-items:center; gap:10px; margin-bottom: 16px; }
.eyebrow-dot{ width:7px; height:7px; border-radius:50%; background: var(--gold-light); box-shadow: 0 0 0 4px rgba(232,196,104,0.18); }
.hero-eyebrow{ color: var(--gold-light); font-size: 13.5px; letter-spacing: 0.02em; }
.hero h1{ font-size: 48px; font-weight: 700; margin: 0 0 12px; line-height: 1.06; max-width: 720px; letter-spacing: -0.01em; }
.hero p.subtitle{ font-size: 16.5px; color: #cdd6ec; margin: 0; max-width: 560px; line-height: 1.65; }

.stat-row{ display:flex; align-items:center; gap:24px; margin-top: 30px; }
.stat-item{ display:flex; flex-direction:column; }
.stat-num{ font-family:'Fraunces',serif; font-size: 30px; font-weight:700; color: var(--gold-light); line-height:1; }
.stat-label{ font-size: 12.5px; color: #9fb0d6; margin-top: 5px; }
.stat-sep{ width:1px; height:34px; background: rgba(255,255,255,0.16); }

.hero-edit-btn{
  margin-top: 24px; background: none; border: 1px solid rgba(255,255,255,0.28);
  color: #e7ecf9; font-size: 13px; padding: 8px 15px; border-radius: 999px;
  cursor: pointer; font-family: inherit; transition: border-color .15s, background .15s;
  display:inline-flex; align-items:center; gap:6px;
}
.hero-edit-btn:hover{ border-color: var(--gold-light); background: rgba(255,255,255,0.07); }

/* ---------- SLIDER ---------- */
.slider-section{ background: var(--navy-2); padding: 22px 0; overflow: hidden; }
.slider-inner{ max-width: 1160px; margin: 0 auto; }
.slider-track{
  display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x proximity;
  scrollbar-width:none; padding: 4px 32px; cursor: grab; user-select: none;
}
.slider-track::-webkit-scrollbar{ display:none; }
.slider-track.dragging{ cursor: grabbing; scroll-snap-type: none; }
.slider-item{ flex:0 0 108px; scroll-snap-align:start; cursor:pointer; }
.slider-photo{ width:108px; height:136px; border-radius:12px; overflow:hidden; position:relative; box-shadow: 0 6px 18px rgba(0,0,0,0.25); transition: transform .2s var(--ease); }
.slider-item:hover .slider-photo{ transform: translateY(-3px); }
.slider-photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }
.slider-photo-fallback{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:#fff; }
.slider-name{ margin-top:8px; font-size:12px; font-weight:600; text-align:center; color:#dbe3f5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ---------- TOOLBAR ---------- */
.toolbar-wrap{ background: rgba(250,246,236,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); position: sticky; top:0; z-index: 25; }
.toolbar{ max-width: 1160px; margin: 0 auto; padding: 16px 32px; display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
.search-box{ flex: 1 1 230px; display:flex; align-items:center; gap:8px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 13px; transition: border-color .15s, box-shadow .15s; }
.search-box:focus-within{ border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,160,54,0.12); }
.search-box svg{ flex-shrink:0; opacity:.55; }
.search-box input{ border:none; outline:none; font-family: inherit; font-size:14px; width:100%; background:transparent; color: var(--ink); }
.spacer{ flex: 1 1 auto; }

.btn{ font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 9px 16px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; display:inline-flex; align-items:center; gap:7px; transition: transform .1s var(--ease), background .15s, border-color .15s, box-shadow .15s; }
.btn:active{ transform: scale(0.96); }
.btn:disabled{ opacity:.6; cursor: default; transform: none; }
.btn-primary{ background: var(--navy); color:#fff; }
.btn-primary:hover:not(:disabled){ background: var(--navy-2); }
.btn-gold{ background: var(--gold); color: var(--navy); }
.btn-gold:hover:not(:disabled){ background: var(--gold-light); box-shadow: 0 4px 14px rgba(201,160,54,0.35); }
.btn-ghost{ background:#fff; color: var(--ink); border-color: var(--border); }
.btn-ghost:hover:not(:disabled){ border-color: var(--gold); }
.btn-danger-outline{ background:#fff; color: var(--danger); border-color: #e6c6c6; }
.btn-danger-outline:hover:not(:disabled){ background: #fbeeee; }
.btn-sm{ padding: 7px 12px; font-size: 12.5px; }

.tag-scroll-wrap{ max-width: 1160px; margin: 0 auto; padding: 0 32px 14px; }
.tag-filters{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.tag-filters::-webkit-scrollbar{ display:none; }
.tag-chip{ font-size: 12.5px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border); background:#fff; color: var(--muted); cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink:0; transition: all .15s var(--ease); }
.tag-chip:hover{ border-color: var(--gold); color: var(--ink); }
.tag-chip.active{ background: var(--navy); border-color: var(--navy); color:#fff; }

.admin-banner{ max-width: 1160px; margin: 0 auto; padding: 10px 32px 0; }
.admin-banner-inner{ display:flex; align-items:center; gap:9px; background: #fff8e6; border: 1px solid var(--gold-light); color: #6b5410; font-size: 13px; padding: 10px 15px; border-radius: var(--radius); animation: slideDown .25s var(--ease); }
.error-banner-inner{ display:flex; align-items:center; gap:9px; background: #fdecec; border: 1px solid #e6b8b8; color: #7a2424; font-size: 13px; padding: 10px 15px; border-radius: var(--radius); margin-bottom: 20px; }
@keyframes slideDown{ from{ opacity:0; transform: translateY(-6px);} to{ opacity:1; transform:none;} }

.content{ max-width: 1160px; margin: 0 auto; padding: 34px 32px 100px; }
.grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; }

/* ---------- TEAM CARD ---------- */
.team-card{
  background: #fff; border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow-sm); cursor: pointer; position: relative;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease);
  opacity: 0; transform: translateY(14px);
}
.team-card.card-in{ opacity: 1; transform: translateY(0); }
.team-card:hover{ transform: translateY(-6px); box-shadow: var(--shadow-md); }

.team-photo-wrap{ position:relative; aspect-ratio: 4 / 5; overflow:hidden; background: var(--navy); }
.team-photo-wrap img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition: transform .4s var(--ease); }
.team-card:hover .team-photo-wrap img{ transform: scale(1.06); }
.team-photo-fallback{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces',serif; font-weight:700; font-size: 30%; color:#fff;
  transition: transform .4s var(--ease);
}
.team-card:hover .team-photo-fallback{ transform: scale(1.06); }

.team-overlay-top{ position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; z-index:3; }
.team-overlay-bottom{
  position:absolute; left:0; right:0; bottom:0; padding: 34px 12px 12px;
  background: linear-gradient(to top, rgba(13,25,48,0.88), transparent);
  display:flex; justify-content:flex-end; gap:8px;
  opacity:0; transform: translateY(8px); transition: all .22s var(--ease);
}
.team-card:hover .team-overlay-bottom{ opacity:1; transform:none; }

.overlay-btn{
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background: rgba(255,255,255,0.94); color: var(--navy); border:none; cursor:pointer;
  transition: transform .15s, background .15s; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
.overlay-btn:hover{ transform: scale(1.08); background: #fff; }
.overlay-btn.wa{ background: #25d366; color:#fff; }
.overlay-btn.wa:hover{ background: #1fb859; }
.overlay-btn.danger:hover{ background: #fbeeee; color: var(--danger); }

.team-info{ padding: 16px 16px 18px; }
.team-name{ font-family:'Fraunces',serif; font-size: 17px; font-weight:700; line-height:1.28; margin: 0 0 4px; }
.team-position{ font-size: 12.5px; color: var(--gold-2); font-weight:600; margin: 0 0 10px; line-height:1.4; }
.team-tag-list{ display:flex; flex-wrap:wrap; gap:6px; margin: 0 0 12px; }
.team-tag-pill{ font-size: 11.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid #d8cf9f; color: var(--navy); background: #fbf7ea; line-height:1.3; }
.team-tag-empty{ font-size:12.5px; color: var(--muted); }
.team-divider{ height:1px; background: var(--border); margin: 0 0 10px; }
.team-phone{ display:flex; align-items:center; gap:6px; color: var(--muted); font-size: 12.5px; }
.team-phone svg{ opacity:.6; flex-shrink:0; }

.empty-state{ text-align:center; padding: 80px 20px; color: var(--muted); grid-column: 1 / -1; }
.empty-state svg{ opacity: .35; margin-bottom: 14px; }
.empty-state .serif{ font-size:23px; color: var(--ink); margin-bottom:8px; }

/* ---------- SKELETON ---------- */
.skeleton-card{ background:#fff; border-radius: var(--radius-lg); overflow:hidden; box-shadow: var(--shadow-sm); }
.skel-photo{ aspect-ratio: 4/5; }
.skel{ background: linear-gradient(90deg, #ece6d6 25%, #f4efe1 37%, #ece6d6 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
@keyframes shimmer{ 0%{ background-position: 100% 0;} 100%{ background-position: -100% 0;} }
.skel-info{ padding:16px; }
.skel-line{ height:12px; border-radius:4px; }

/* ---------- MODAL ---------- */
.overlay{ position: fixed; inset:0; background: rgba(13,25,48,0.6); backdrop-filter: blur(3px); display:flex; align-items:center; justify-content:center; z-index: 100; padding: 20px; animation: fadeIn .18s var(--ease); }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.modal{ background: #fff; border-radius: 16px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y:auto; padding: 28px; animation: popIn .2s var(--ease); }
@keyframes popIn{ from{ opacity:0; transform: scale(.96) translateY(6px);} to{ opacity:1; transform:none;} }
.modal h2{ font-family:'Fraunces',serif; font-size:22px; margin: 0 0 20px; }
.field{ margin-bottom: 16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color: var(--muted); margin-bottom:6px; }
.field input[type=text], .field input[type=tel]{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: 14px; outline:none; background:#fdfcf8; transition: border-color .15s, box-shadow .15s; }
.field input:focus{ border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,160,54,0.12); }
.chip-input-box{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1px solid var(--border); border-radius: var(--radius); padding: 8px; background:#fdfcf8; }
.chip-input-box:focus-within{ border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,160,54,0.12); }
.chip{ background: var(--navy); color:#fff; font-size:12px; padding:4px 8px 4px 10px; border-radius:999px; display:flex; align-items:center; gap:6px; animation: popIn .15s var(--ease); }
.chip button{ background:none; border:none; color:#cdd6ec; cursor:pointer; font-size:13px; line-height:1; padding:0; }
.chip-input-box input{ border:none; outline:none; flex:1 1 100px; font-size:13.5px; min-width:100px; background:transparent; font-family:inherit; }

.dropzone{ border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 16px; display:flex; align-items:center; gap:14px; cursor:pointer; background:#fdfcf8; transition: border-color .15s, background .15s; }
.dropzone:hover, .dropzone.drag-over{ border-color: var(--gold); background: #fffdf6; }
.dropzone input{ display:none; }
.photo-preview{ width:56px; height:56px; border-radius:12px; overflow:hidden; flex-shrink:0; border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; background: var(--navy); color:#fff; font-family:'Fraunces',serif; font-weight:600; }
.photo-preview img{ width:100%; height:100%; object-fit:cover; }
.dropzone-text{ font-size:13px; color: var(--muted); }
.dropzone-text strong{ color: var(--ink); }
.photo-remove{ background:none; border:1px solid var(--border); color:var(--danger); font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer; }
.photo-remove:hover{ background:#fbeeee; }
.or-divider{ text-align:center; font-size:11.5px; color: var(--muted); margin: 10px 0; position:relative; }
.or-divider::before, .or-divider::after{ content:""; position:absolute; top:50%; width:42%; height:1px; background: var(--border); }
.or-divider::before{ left:0; }
.or-divider::after{ right:0; }

.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top: 22px; }
.hint{ font-size:11.5px; color: var(--muted); margin-top:6px; }

.pin-panel{ width:100%; max-width: 320px; text-align:center; }
.pin-panel input{ width:100%; text-align:center; letter-spacing: 1px; font-size:17px; padding: 12px; border:1px solid var(--border); border-radius: var(--radius); font-family:'Plus Jakarta Sans', sans-serif; margin: 16px 0 6px; outline:none; }
.pin-panel input:focus{ border-color: var(--gold); }
.pin-error{ color: var(--danger); font-size:13px; min-height: 18px; }

/* ---------- DETAIL MODAL ---------- */
.detail-modal{ max-width: 420px; padding:0; overflow:hidden; }
.detail-photo{ position:relative; aspect-ratio: 16/10; overflow:hidden; background: var(--navy); }
.detail-photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.detail-photo-fallback{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:56px; color:#fff; }
.detail-close{ position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; background: rgba(255,255,255,0.92); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color: var(--navy); z-index:2; }
.detail-close:hover{ background:#fff; }
.detail-body{ padding: 22px 24px 26px; }
.detail-name{ font-family:'Fraunces',serif; font-size:22px; font-weight:700; margin:0 0 4px; }
.detail-position{ font-size: 13px; color: var(--gold-2); font-weight:600; margin: 0 0 10px; }
.detail-phone{ color: var(--muted); font-size:13.5px; margin-bottom:18px; }
.detail-actions{ display:flex; gap:10px; margin-bottom: 22px; }
.detail-actions .btn{ flex:1; justify-content:center; }
.detail-section-label{ font-size:12px; font-weight:600; color: var(--muted); margin-bottom:9px; }
.tag-list{ display:flex; flex-wrap:wrap; gap:6px; }
.tag-pill{ font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #d8cf9f; color: var(--navy); background: #fbf7ea; }

/* ---------- TOAST ---------- */
#toast-wrap{ position: fixed; bottom: 22px; right: 22px; display:flex; flex-direction:column; gap:10px; z-index: 200; }
.toast{ background: var(--navy); color:#fff; padding: 12px 16px; border-radius: 8px; font-size: 13.5px; display:flex; align-items:center; gap:10px; box-shadow: var(--shadow-md); animation: toastIn .2s var(--ease); max-width: 320px; }
.toast.error{ background: var(--danger); }
.toast.success{ background: var(--success); }
@keyframes toastIn{ from{ opacity:0; transform: translateX(20px);} to{ opacity:1; transform:none;} }
.toast.toast-out{ animation: toastOut .2s var(--ease) forwards; }
@keyframes toastOut{ to{ opacity:0; transform: translateX(20px);} }

.setup-screen{ max-width: 640px; margin: 60px auto; padding: 32px; background:#fff; border:1px solid var(--border); border-radius: 10px; }
.setup-screen h2{ font-family:'Fraunces',serif; margin-top:0; }
.setup-screen code{ background: var(--cream); padding: 2px 6px; border-radius: 4px; font-size: 13px; }

@media (max-width: 640px){
  .hero{ padding: 44px 20px 36px; }
  .hero h1{ font-size: 32px; }
  .toolbar, .content, .admin-banner, .tag-scroll-wrap{ padding-left:20px; padding-right:20px; }
  .stat-row{ gap:18px; }
  .detail-actions{ flex-direction: column; }
}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast-wrap"></div>

<script>
(function(){

  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeZWHlq6hPG3yPw22Q5yANv_pS07to1yO9X7w1EMeBP74Su0QWZ7ng5-R95meOrvnOYg/exec";

  // Opsional: isi dengan Client ID dari api.imgur.com/oauth2/addclient agar foto tersimpan
  // dalam resolusi penuh (bukan dipadatkan). Kosongkan / biarkan placeholder untuk memakai
  // penyimpanan lokal terkompresi sebagai cadangan otomatis.
  const IMGUR_CLIENT_ID = "PASTE_CLIENT_ID_IMGUR_DI_SINI";

  const DUOTONES = [
    ["#10203f", "#24407a"],
    ["#9c7a1f", "#e8c468"],
    ["#1f3a44", "#3f6b74"],
    ["#4a2634", "#7a3d4a"],
    ["#16294e", "#3a5590"]
  ];

  let state = {
    people: [],
    meta: { eyebrow: "", title: "", subtitle: "" },
    isAdmin: false,
    adminPin: null,
    search: "",
    activeTag: null,
    loading: true,
    pendingDeleteId: null,
    error: null
  };

  const configured = APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf("http") === 0;

  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function initials(name){
    const parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return "?";
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  function duotone(name){
    let sum = 0;
    for(let i=0;i<name.length;i++) sum += name.charCodeAt(i);
    return DUOTONES[sum % DUOTONES.length];
  }
  function waLink(phone){
    let n = String(phone||"").replace(/[^0-9]/g,"");
    if(n.startsWith("0")) n = "62" + n.slice(1);
    else if(!n.startsWith("62")) n = "62" + n;
    return "https://wa.me/" + n;
  }
  function debounce(fn, ms){
    let t;
    return function(){
      const args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, ms);
    };
  }

  function showToast(message, type){
    const wrap = document.getElementById("toast-wrap");
    const el = document.createElement("div");
    el.className = "toast" + (type ? " " + type : "");
    el.textContent = message;
    wrap.appendChild(el);
    setTimeout(function(){
      el.classList.add("toast-out");
      setTimeout(function(){ el.remove(); }, 220);
    }, 2600);
  }

  async function apiGet(){
    const res = await fetch(APPS_SCRIPT_URL + "?action=list");
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }
  async function apiPost(payload){
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function loadData(){
    state.loading = true;
    render();
    try{
      const data = await apiGet();
      if(!data.ok) throw new Error(data.error || "Gagal memuat data");
      state.people = data.people || [];
      state.meta = data.meta || state.meta;
      state.error = null;
    } catch(err){
      console.error(err);

  function allTags(){
    const set = new Set();
    state.people.forEach(function(p){ (p.tags||[]).forEach(function(t){ set.add(t); }); });

  function filteredPeople(){
    const q = state.search.trim().toLowerCase();
    return state.people.filter(function(p){
      const matchesTag = !state.activeTag || (p.tags||[]).includes(state.activeTag);
      if(!matchesTag) return false;
      if(!q) return true;
      return (p.name + " " + (p.tags||[]).join(" ")).toLowerCase().includes(q);

  let sliderAutoTimer = null;

  function setupSlider(){
    const track = document.getElementById("slider-track");
    if(!track) return;

    function stepOnce(){
      const item = track.querySelector(".slider-item");
      const step = item ? item.offsetWidth + 14 : 122;
      if(track.scrollLeft + track.clientWidth >= track.scrollWidth - 4){
        track.scrollTo({ left: 0, behavior: "smooth" });
      } else {
        track.scrollBy({ left: step, behavior: "smooth" });
      }
    }
    function startAuto(){
      clearInterval(sliderAutoTimer);
      sliderAutoTimer = setInterval(stepOnce, 2800);
    }
    function pauseAuto(){
      clearInterval(sliderAutoTimer);
      clearTimeout(sliderResumeTimer);
      sliderResumeTimer = setTimeout(startAuto, 4000);
    }

    let isDown = false, startX = 0, startScroll = 0, moved = false;
    track.addEventListener("pointerdown", function(e){
      isDown = true; moved = false;
      track.classList.add("dragging");
      startX = e.pageX; startScroll = track.scrollLeft;
      pauseAuto();
    });
    window.addEventListener("pointermove", function(e){
      if(!isDown) return;
      const dx = e.pageX - startX;
      if(Math.abs(dx) > 4) moved = true;
      track.scrollLeft = startScroll - dx;
    });
    window.addEventListener("pointerup", function(){
      if(!isDown) return;
      isDown = false;
      track.classList.remove("dragging");
    });
    track.addEventListener("click", function(e){
      if(moved){ e.stopPropagation(); e.preventDefault(); }
    }, true);
    track.addEventListener("mouseenter", function(){ clearInterval(sliderAutoTimer); clearTimeout(sliderResumeTimer); });
    track.addEventListener("mouseleave", function(){ if(!isDown) startAuto(); });

    startAuto();
  }

    html += '<div class="field"><label>Nama lengkap &amp; gelar</label><input type="text" id="f-name" placeholder="mis. Nama Lengkap, S.E., M.Sc." value="' + (person ? escapeHtml(person.name) : "") + '"></div>';
    html += '<div class="field"><label>Jabatan / posisi</label><input type="text" id="f-position" placeholder="mis. Analis Kebijakan Ahli Muda" value="' + (person && person.position ? escapeHtml(person.position) : "") + '"></div>';
    html += '<div class="field"><label>Nomor telepon / WhatsApp</label><input type="tel" id="f-phone" placeholder="mis. 0812-3456-7890" value="' + (person ? escapeHtml(person.phone) : "") + '"></div>';
    html += '<div class="field"><label>Bidang / jabatan fungsional yang ditangani</label>';
    html += '<div class="chip-input-box" id="chip-box"><input type="text" id="f-tag-input" placeholder="Ketik lalu tekan Enter"></div>';
    html += '<div class="hint">Tekan Enter atau koma setelah tiap bidang.</div></div>';
    html += '<div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Batal</button>';
    html += '<button class="btn btn-gold" id="save-person-btn" data-action="save-person" data-id="' + (person ? person.id : "") + '">Simpan</button></div>';
    html += '</div></div>';

    document.getElementById("modal-slot").innerHTML = html;

    renderChips();
    setupDropzone();

    const useUrlBtn = document.getElementById("use-photo-url-btn");
    const urlInput = document.getElementById("f-photo-url");
    function applyPhotoUrl(){
      const val = urlInput.value.trim();
      if(!val){ showToast("Tempel link foto dulu.", "error"); return; }
      setPhotoPreview(val);
      showToast("Link foto diterapkan.", "success");
    }
    useUrlBtn.addEventListener("click", applyPhotoUrl);
    urlInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); applyPhotoUrl(); } });

    const tagInput = document.getElementById("f-tag-input");
    tagInput.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === ","){
        e.preventDefault();
        const val = tagInput.value.trim().replace(/,$/, "");
        if(val){ modalTags.push(val); tagInput.value = ""; renderChips(); }
      } else if(e.key === "Backspace" && tagInput.value === "" && modalTags.length){
        modalTags.pop(); renderChips();
      }
    });

    const removeBtn = document.getElementById("remove-photo-btn");
    if(removeBtn){
      removeBtn.addEventListener("click", function(){
        modalPhoto = null;
        document.getElementById("photo-preview").innerHTML = "<span>?</span>";
        document.getElementById("photo-remove-wrap").innerHTML = "";
      });
    }
  }

  function setupDropzone(){
    const zone = document.getElementById("dropzone");
    const input = document.getElementById("f-photo");
    zone.addEventListener("click", function(){ input.click(); });
    input.addEventListener("change", function(e){ if(e.target.files[0]) handlePhotoFile(e.target.files[0]); });
    ["dragover","dragenter"].forEach(function(evt){ zone.addEventListener(evt, function(e){ e.preventDefault(); zone.classList.add("drag-over"); }); });
    ["dragleave","drop"].forEach(function(evt){ zone.addEventListener(evt, function(e){ e.preventDefault(); zone.classList.remove("drag-over"); }); });
    zone.addEventListener("drop", function(e){
      const file = e.dataTransfer.files[0];
      if(file && file.type.indexOf("image/") === 0) handlePhotoFile(file);
    });
  }

  function renderChips(){
    const box = document.getElementById("chip-box");
    const input = document.getElementById("f-tag-input");
    box.querySelectorAll(".chip").forEach(function(c){ c.remove(); });
    modalTags.forEach(function(t, i){
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = escapeHtml(t) + ' <button type="button" data-idx="' + i + '" data-action="remove-chip">✕</button>';
      box.insertBefore(chip, input);
    });
  }

  const MAX_PHOTO_BASE64_LEN = 42000; // batas aman jauh di bawah limit sel Google Sheets (50.000 karakter)
  const imgurConfigured = IMGUR_CLIENT_ID && IMGUR_CLIENT_ID.indexOf("PASTE_") !== 0;

  function renderPhotoDataUrl(img, size, quality){
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const scale = Math.max(size / img.width, size / img.height);
    const w = img.width * scale, h = img.height * scale;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
    return canvas.toDataURL("image/jpeg", quality);
  }

  function localCompressFallback(img){
    let size = 480;
    let quality = 0.85;
    let dataUrl = renderPhotoDataUrl(img, size, quality);
    let guard = 0;
    while(dataUrl.length > MAX_PHOTO_BASE64_LEN && guard < 12){
      if(quality > 0.5){ quality -= 0.08; }
      else { size = Math.round(size * 0.85); }
      dataUrl = renderPhotoDataUrl(img, size, quality);
      guard++;
    }
    return dataUrl;
  }

  function imageToBlob(img, maxDim, quality){
    return new Promise(function(resolve){
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob){ resolve(blob); }, "image/jpeg", quality);
    });
  }

  async function uploadToImgur(blob){
    const formData = new FormData();
    formData.append("image", blob);
    const res = await fetch("https://api.imgur.com/3/image", {
      method: "POST",
      headers: { "Authorization": "Client-ID " + IMGUR_CLIENT_ID },
      body: formData
    });
    const data = await res.json();
    if(data && data.success && data.data && data.data.link){
      return data.data.link;
    }
    throw new Error((data && data.data && data.data.error) || "Upload ke Imgur gagal");
  }

  function setPhotoPreview(url){
    modalPhoto = url;
    const preview = document.getElementById("photo-preview");
    if(preview) preview.innerHTML = '<img src="' + url + '">';
    const wrap = document.getElementById("photo-remove-wrap");
    if(wrap && !document.getElementById("remove-photo-btn")){
      wrap.innerHTML = '<div style="margin-top:8px;"><button type="button" class="photo-remove" id="remove-photo-btn">Hapus foto</button></div>';
      document.getElementById("remove-photo-btn").addEventListener("click", function(){
        modalPhoto = null;
        document.getElementById("photo-preview").innerHTML = "<span>?</span>";
        wrap.innerHTML = "";
      });
    }
  }

  function setPhotoLoading(isLoading){
    const zone = document.getElementById("dropzone");
    if(!zone) return;
    const textEl = zone.querySelector(".dropzone-text");
    if(isLoading){
      zone.dataset.origText = textEl.innerHTML;
      textEl.innerHTML = '<div><strong>Mengunggah foto…</strong></div><div>Mohon tunggu sebentar.</div>';
      zone.style.pointerEvents = "none";
      zone.style.opacity = "0.7";
    } else {
      if(zone.dataset.origText) textEl.innerHTML = zone.dataset.origText;
      zone.style.pointerEvents = "";
      zone.style.opacity = "";
    }
  }

  function handlePhotoFile(file){
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = async function(){
        if(imgurConfigured){
          setPhotoLoading(true);
          try{
            const blob = await imageToBlob(img, 900, 0.85);
            const url = await uploadToImgur(blob);
            setPhotoLoading(false);
            setPhotoPreview(url);
            return;
          } catch(err){
            console.error(err);
            setPhotoLoading(false);
            showToast("Upload ke Imgur gagal, memakai penyimpanan lokal sebagai cadangan.", "error");
          }
        }
        setPhotoPreview(localCompressFallback(img));
      };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ showToast("Gagal membaca gambar. Coba file lain.", "error"); };
    reader.readAsDataURL(file);
  }

  async function savePerson(existingId){
    const name = document.getElementById("f-name").value.trim();
    const position = document.getElementById("f-position").value.trim();
    const phone = document.getElementById("f-phone").value.trim();
    if(!name){ showToast("Nama wajib diisi.", "error"); return; }
    const btn = document.getElementById("save-person-btn");
    btn.disabled = true; btn.textContent = "Menyimpan…";
    const person = { id: existingId || undefined, name: name, position: position, phone: phone, tags: modalTags.slice(), photo: modalPhoto || "" };
    try{
      const res = await apiPost({
        action: existingId ? "updatePerson" : "addPerson",
        pin: state.adminPin,
        person: person
      });
      if(res.ok){
        state.people = res.people;
        closeModal();
        render();
        showToast(existingId ? "Perubahan disimpan." : "PIC baru ditambahkan.", "success");
      } else {
        showToast(res.error || "Gagal menyimpan.", "error");
        btn.disabled = false; btn.textContent = "Simpan";
      }
    } catch(err){
      showToast("Tidak dapat terhubung ke server. Foto yang terlalu besar bisa jadi penyebabnya.", "error");
      btn.disabled = false; btn.textContent = "Simpan";
    }
  }

  async function deletePerson(id){
    state.pendingDeleteId = null;
    try{
      const res = await apiPost({ action: "deletePerson", pin: state.adminPin, id: id });
      if(res.ok){ state.people = res.people; showToast("Data dihapus.", "success"); render(); }
      else { showToast(res.error || "Gagal menghapus.", "error"); renderGrid(); }
    } catch(err){ showToast("Tidak dapat terhubung ke server.", "error"); renderGrid(); }
  }

  document.addEventListener("click", function(e){
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const action = el.dataset.action;

    if(action === "stop"){
      e.stopPropagation();
      return;
    } else if(action === "filter-tag"){
      const tag = el.dataset.tag;
      state.activeTag = state.activeTag === tag ? null : tag;
      render();
    } else if(action === "toggle-admin"){
      if(state.isAdmin){ state.isAdmin = false; state.adminPin = null; render(); }
      else { openPinModal(); }
    } else if(action === "edit-header"){
      openHeaderModal();
    } else if(action === "close-modal"){
      closeModal();
    } else if(action === "add"){
      openPersonModal(null);
    } else if(action === "open-detail"){
      openDetailModal(el.dataset.id);
    } else if(action === "edit"){
      e.stopPropagation();
      openPersonModal(el.dataset.id);
    } else if(action === "delete"){
      e.stopPropagation();
      state.pendingDeleteId = el.dataset.id;
      renderGrid();
    } else if(action === "delete-confirm"){
      e.stopPropagation();
      deletePerson(el.dataset.id);
    } else if(action === "pin-submit"){
      submitPin();
    } else if(action === "save-header"){
      saveHeader();
    } else if(action === "save-person"){
      savePerson(el.dataset.id || null);
    } else if(action === "remove-chip"){
      modalTags.splice(Number(el.dataset.idx), 1);
      renderChips();
    } else if(action === "copy-phone"){
      const phone = el.dataset.phone;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(phone).then(function(){ showToast("Nomor disalin.", "success"); })
          .catch(function(){ showToast("Gagal menyalin nomor.", "error"); });
      }
    }

    if(e.target.classList.contains("overlay")) closeModal();
  });

  if(configured){ loadData(); } else { renderSetupScreen(); }
})();
</script>
</body>
</html>
